[project]
name = "lucism_monitor_tui"
version = "0.1.0"
description = "TUI for lucism_monitor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "certifi>=2026.6.17",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
    # "textual-dev>=1.8.0",
]

[project.scripts]
lucism_monitor_tui = "lucism_monitor_tui.app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
